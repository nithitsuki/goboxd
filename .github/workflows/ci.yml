name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13" # must match the `toolchain` in go.mod and .go-version
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # pinned for reproducible analysis (see .go-version)
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: Unit tests
        run: go test -v -count=1 ./internal/... ./cmd/...

  # Root-only sandbox gate: the only place the isolation boundary is actually
  # exercised in CI. Builds nsjail from the pinned submodule, installs EVERY
  # language runtime via the same scripts/install.sh path the Docker image
  # uses, then runs the runner integration suite AND the full
  # penetration + fixture corpus (no SKIP_PENETRATION) across all installed
  # languages. This makes the README's pentest claim a CI-enforced fact instead
  # of documentation drift. Runs on every push/PR.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # nsjail + its kafel submodule
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: Install nsjail build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make g++ pkg-config protobuf-compiler libprotobuf-dev \
            libabsl-dev libnl-3-dev libnl-route-3-dev libcap-dev \
            libseccomp-dev
      - name: Build and install nsjail
        run: |
          make -C external/nsjail
          sudo make -C external/nsjail install
      # Install every language runtime using the project's own install scripts
      # (the same ones the Docker image runs), plus bash/gawk which are plain
      # system packages. mirrors the image so CI matches production.
      - name: Install all language runtimes
        run: |
          sudo apt-get install -y --no-install-recommends bash gawk
          sudo bash scripts/install.sh
      - name: Runner integration tests (root)
        run: sudo -E env "PATH=$PATH" HOME=/root go test -count=1 ./internal/runner/...
      # Full corpus across all installed languages, penetration ENABLED.
      # GOBOXD_LANGS is left unset so the server advertises every runtime the
      # image installs; the fixture harness skips any unadvertised language.
      - name: Penetration + integration suite (all languages, root)
        run: sudo -E env "PATH=$PATH" HOME=/root go test -count=1 ./tests/integration/...
      # #14 soak gate: leak/soak + fuzz regression (see tests/integration/soak_test.go).
      - name: Soak + fuzz regression (root)
        run: sudo -E env "PATH=$PATH" HOME=/root go test -count=1 -run 'Soak|Fuzz' ./tests/integration/...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check version pins
        run: bash scripts/check-pins.sh

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Playground build
        run: |
          cd playground
          bun install
          bunx vite build