name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13" # must match the `toolchain` in go.mod and .go-version
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2 # pinned for reproducible analysis (see .go-version)
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: Unit tests
        run: go test -v -count=1 ./internal/... ./cmd/...

  # Root-only sandbox gate: the only place the isolation boundary is actually
  # exercised in CI. Builds nsjail from the pinned submodule, installs EVERY
  # language runtime via the same scripts/install.sh path the Docker image
  # uses, then runs the runner integration suite AND the full
  # penetration + fixture corpus (no SKIP_PENETRATION) across all installed
  # languages. This makes the README's pentest claim a CI-enforced fact instead
  # of documentation drift. Runs on every push/PR.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Penetration-critical subset that fits the ~14 GB runner disk; the full
      # 28-language image needs ~33 GB and can't fit a hosted runner. Widen to
      # add coverage. The pinned-bookworm image installs these deterministically.
      SANDBOX_LANGS: py3,c,cpp,go,rust,java,js,bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # nsjail + its kafel submodule
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: Install nsjail build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make g++ pkg-config protobuf-compiler libprotobuf-dev \
            libabsl-dev libnl-3-dev libnl-route-3-dev libcap-dev \
            libseccomp-dev
      - name: Build and install nsjail
        run: |
          make -C external/nsjail
          sudo make -C external/nsjail install
      - name: Runner integration tests (host nsjail, root)
        run: sudo -E env "PATH=$PATH" HOME=/root go test -count=1 ./internal/runner/...
      # Language runtimes come from the PINNED Debian-bookworm Docker image, not
      # the ephemeral ubuntu host. The install scripts are bookworm-pinned by
      # name AND version (e.g. libprotobuf32, ruby3.1, curl=…deb12u15) and can
      # never resolve on ubuntu-latest, which is why the old host install kept
      # failing with "E: Version … was not found". Building the image resolves
      # every pin deterministically and exercises the real artifact.
      - name: Build goboxd image (pinned bookworm)
        run: make build LANGS=${{ env.SANDBOX_LANGS }}
      - name: Start goboxd (privileged)
        run: |
          LANGS=${{ env.SANDBOX_LANGS }} docker compose up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/readyz >/dev/null 2>&1; then
              echo "goboxd ready"; exit 0
            fi
            sleep 2
          done
          echo "goboxd not ready:"; docker compose logs; exit 1
      # Full penetration + fixture corpus (penetration ENABLED) against the
      # running bookworm container. Soak/Fuzz are excluded here — see below.
      - name: Penetration + integration suite (in-container)
        run: API_URL=http://localhost:8080 go test -count=1 -skip 'Soak|Fuzz' ./tests/integration/...
      # #14 soak/fuzz gate on the HOST with one runtime so jail-dir/cgroup leak
      # checks are meaningful (they count the host /tmp + cgroup tree, which an
      # in-container server can't expose). python3 is a plain ubuntu package.
      - name: Install soak runtime (host, minimal)
        run: sudo apt-get install -y --no-install-recommends python3
      - name: Soak + fuzz regression (host, root)
        run: sudo -E env "PATH=$PATH" HOME=/root go test -count=1 -run 'Soak|Fuzz' ./tests/integration/...

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check version pins
        run: bash scripts/check-pins.sh

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Playground build
        run: |
          cd playground
          bun install
          bunx vite build