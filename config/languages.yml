  - id: odin
    name: Odin
    source_filename: solution.odin
    artifact: solution
    # odin --version prints usage and exits 1; the version subcommand works.
    smoke_cmd: /usr/local/odin/odin
    smoke_args: ["version"]
    build:
      cmd: /usr/local/odin/odin
      # -file: treat the single source file as a self-contained package
      # (odin build normally takes a package directory).
      args: ["build", "{{source}}", "-file", "-out:{{artifact}}", "-o:speed"]
      limits:
        wall_time_s: 30
        cpu_time_s: 240
        memory_kb: 4194304
        max_processes: 100
    run:
