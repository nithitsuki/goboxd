      args: ["{{source}}"]
      limits:
        wall_time_s: 6
        cpu_time_s: 48
        memory_kb: 4194304
        max_processes: 100
      # P1-10: measured-safe maximum for build wall time (2x the default).
      ceiling:
        wall_time_s: 12
    run:
      cmd: /usr/bin/java
      args: ["-cp", ".", "{{artifact}}"]
      limits:
        wall_time_s: 6
        cpu_time_s: 24
        memory_kb: 4194304
        max_processes: 100

