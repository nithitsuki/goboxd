      args: ["-NoProfile", "-NonInteractive", "-File", "{{source}}"]
      limits:
        wall_time_s: 9
        cpu_time_s: 36
        # CoreCLR reserves a large VA range at startup (measured: >4GB needed
        # under the tight RLIMIT_AS guard; 6GB and 8GB verified on 7.6.5).
        # The 8GB virtual cap mirrors the elixir decision: RSS stays small,
        # the cap doubles as the cgroup resident cap where cgroup v2 is
        # active.
        memory_kb: 8388608
        max_processes: 100

