languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: c
    name: C
    source_filename: solution.c
    artifact: solution
    build:
      cmd: /usr/bin/gcc
      args: ["-x", "c", "{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 5
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-O0", "-O1", "-O2", "-O3", "-Wall", "-Wextra", "-std=*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    build:
      cmd: /usr/bin/g++
      args: ["-x", "c++", "{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 5
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-O0", "-O1", "-O2", "-O3", "-Wall", "-Wextra", "-std=*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: java
    name: Java
    source_filename: Main.java
    artifact: Main
    build:
      cmd: /usr/bin/javac
      args: ["{{source}}"]
      limits:
        wall_time_s: 6
        memory_kb: 102400
        max_processes: 100
    run:
      cmd: /usr/bin/java
      args: ["-cp", ".", "{{artifact}}"]
      limits:
        wall_time_s: 6
        memory_kb: 102400
        max_processes: 100

  - id: bash
    name: Bash
    source_filename: solution.sh
    run:
      cmd: /usr/bin/bash
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: js
    name: JavaScript (Node)
    source_filename: solution.js
    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: verilog
    name: Verilog
    source_filename: solution.v
    artifact: solution
    build:
      cmd: /usr/bin/iverilog
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 6
        memory_kb: 102400
        max_processes: 100
    run:
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 6
        memory_kb: 102400
        max_processes: 100

  - id: rust
    name: Rust
    source_filename: main.rs
    artifact: main
    build:
      cmd: /usr/bin/rustc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-O*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: go
    name: Go
    source_filename: main.go
    artifact: main
    build:
      cmd: /usr/bin/go
      args: ["build", "{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-ldflags*", "-tags*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: haskell
    name: Haskell
    source_filename: solution.hs
    artifact: solution
    build:
      cmd: /usr/bin/ghc
      args: ["-O2", "-dynamic", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: ocaml
    name: OCaml
    source_filename: solution.ml
    artifact: solution
    build:
      cmd: /usr/bin/ocamlopt
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: r
    name: R
    source_filename: solution.R
    run:
      cmd: /usr/bin/Rscript
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: d
    name: D (GDC)
    source_filename: solution.d
    artifact: solution
    build:
      cmd: /usr/bin/gdc
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: lua
    name: Lua (LuaJIT)
    source_filename: solution.lua
    run:
      cmd: /usr/bin/luajit
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: perl
    name: Perl
    source_filename: solution.pl
    run:
      cmd: /usr/bin/perl
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: erl
    name: Erlang
    source_filename: solution.erl
    build:
      cmd: /usr/bin/erlc
      args: ["{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: erl -noshell -s solution start -s init stop
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: lisp
    name: Lisp (SBCL)
    source_filename: solution.lisp
    run:
      cmd: /usr/bin/sbcl
      args: ["--script", "{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
