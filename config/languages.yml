languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        cpu_time_s: 11
        memory_kb: 1048576
        max_processes: 100

  - id: gawk
    name: AWK (gawk)
    source_filename: solution.awk
    run:
      cmd: /usr/bin/gawk
      args: ["-f", "{{source}}"]
      limits:
        wall_time_s: 5
        cpu_time_s: 7
        memory_kb: 262144
        max_processes: 64

  - id: c
    name: C
    source_filename: solution.c
    artifact: solution
    build:
      cmd: /usr/bin/gcc
      args: ["-x", "c", "{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 5
        cpu_time_s: 40
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-O0", "-O1", "-O2", "-O3", "-Wall", "-Wextra", "-std=*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        cpu_time_s: 20
        memory_kb: 524288
        max_processes: 64

  - id: cpp
    name: C++
