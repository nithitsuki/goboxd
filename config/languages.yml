languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 1048576
        max_processes: 100

  - id: c
    name: C
    source_filename: solution.c
    artifact: solution
    build:
      cmd: /usr/bin/gcc
      args: ["-x", "c", "{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 5
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-O0", "-O1", "-O2", "-O3", "-Wall", "-Wextra", "-std=*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    build:
      cmd: /usr/bin/g++
      args: ["-x", "c++", "{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 5
        memory_kb: 1048576
        max_processes: 100
      flag_allowlist: ["-O0", "-O1", "-O2", "-O3", "-Wall", "-Wextra", "-std=*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: java
    name: Java
    source_filename: Main.java
    artifact: Main
    build:
      cmd: /usr/bin/javac
      args: ["{{source}}"]
      limits:
        wall_time_s: 6
        memory_kb: 4194304
        max_processes: 100
    run:
      cmd: /usr/bin/java
      args: ["-cp", ".", "{{artifact}}"]
      limits:
        wall_time_s: 6
        memory_kb: 4194304
        max_processes: 100

  - id: bash
    name: Bash
    source_filename: solution.sh
    run:
      cmd: /usr/bin/bash
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: js
    name: JavaScript (Node)
    source_filename: solution.js
    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 2097152
        max_processes: 100

  - id: verilog
    name: Verilog
    source_filename: solution.v
    artifact: solution
    build:
      cmd: /usr/bin/iverilog
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 6
        memory_kb: 102400
        max_processes: 100
    run:
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 6
        memory_kb: 102400
        max_processes: 100

  - id: rust
    name: Rust
    source_filename: main.rs
    artifact: main
    build:
      cmd: /usr/bin/rustc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 4194304
        max_processes: 100
      flag_allowlist: ["-O*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: go
    name: Go
    source_filename: main.go
    artifact: main
    build:
      cmd: /usr/bin/go
      args: ["build", "{{flags}}", "-p", "4", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 4194304
        max_processes: 100
      flag_allowlist: ["-ldflags*", "-tags*"]
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 1048576
        max_processes: 64

  - id: haskell
    name: Haskell
    source_filename: solution.hs
    artifact: solution
    build:
      cmd: /usr/bin/ghc
      args: ["-O2", "-dynamic", "-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: ocaml
    name: OCaml
    source_filename: solution.ml
    artifact: solution
    build:
      cmd: /usr/bin/ocamlopt
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: r
    name: R
    source_filename: solution.R
    run:
      cmd: /usr/bin/Rscript
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 4194304
        max_processes: 100

  - id: d
    name: D (GDC)
    source_filename: solution.d
    artifact: solution
    build:
      cmd: /usr/bin/gdc
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 5
        memory_kb: 524288
        max_processes: 64

  - id: lua
    name: Lua (LuaJIT)
    source_filename: solution.lua
    run:
      cmd: /usr/bin/luajit
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: perl
    name: Perl
    source_filename: solution.pl
    run:
      cmd: /usr/bin/perl
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: erl
    name: Erlang
    source_filename: solution.erl
    build:
      cmd: /usr/bin/erlc
      args: ["-o", "/app", "/app/{{source}}"]
      limits:
        wall_time_s: 15
        memory_kb: 2097152
        max_processes: 100
    run:
      cmd: /usr/bin/erl
      args: ["-noshell", "+S", "2:2", "-pa", "/app", "-s", "solution", "start", "-s", "init", "stop"]
      limits:
        wall_time_s: 5
        memory_kb: 2097152
        max_processes: 64

  - id: lisp
    name: Lisp (SBCL)
    source_filename: solution.lisp
    run:
      cmd: /usr/bin/sbcl
      args: ["--dynamic-space-size", "512", "--script", "{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 1048576
        max_processes: 100

  - id: py2
    name: Python 2
    source_filename: solution.py
    run:
      cmd: /usr/local/bin/python2.7
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: ruby
    name: Ruby
    source_filename: solution.rb
    run:
      cmd: /usr/bin/ruby
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: php
    name: PHP
    source_filename: solution.php
    run:
      cmd: /usr/bin/php
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100

  - id: racket
    name: Racket
    source_filename: solution.rkt
    run:
      cmd: /usr/local/bin/racket
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 524288
        max_processes: 100

  - id: elixir
    name: Elixir
    source_filename: solution.exs
    run:
      cmd: /usr/bin/elixir
      args: ["--erl", "+S 2:2", "{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 8388608
        max_processes: 100

  - id: ts
    name: TypeScript
    source_filename: solution.ts
    artifact: solution.js
    build:
      cmd: /usr/local/bin/tsc
      args: ["{{source}}", "--target", "ES2024", "--module", "commonjs", "--strict", "--skipLibCheck", "--typeRoots", "/usr/local/lib/node_modules/@types"]
      limits:
        wall_time_s: 15
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: /usr/bin/node
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 9
        memory_kb: 524288
        max_processes: 64

  - id: csharp
    name: C#
    source_filename: solution.cs
    artifact: solution.dll
    build:
      cmd: /usr/local/bin/csharp-build
      args: ["{{source}}"]
      limits:
        wall_time_s: 20
        memory_kb: 4194304
        max_processes: 100
    run:
      cmd: /usr/local/dotnet/dotnet
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 9
        memory_kb: 4194304
        max_processes: 64

  - id: swift
    name: Swift
    source_filename: solution.swift
    artifact: solution
    build:
      cmd: /usr/local/swift/usr/bin/swiftc
      args: ["-o", "{{artifact}}", "{{source}}", "-Xlinker", "-rpath", "-Xlinker", "/usr/local/swift/usr/lib"]
      limits:
        wall_time_s: 30
        memory_kb: 2097152
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 9
        memory_kb: 524288
        max_processes: 64

  - id: scala
    name: Scala
    source_filename: solution.scala
    artifact: Solution
    build:
      cmd: /usr/local/scala3/bin/scalac
      args: ["-d", ".", "{{source}}"]
      limits:
        wall_time_s: 20
        memory_kb: 4194304
        max_processes: 100
    run:
      cmd: /usr/local/scala3/bin/scala
      args: ["{{artifact}}"]
      limits:
        wall_time_s: 9
        memory_kb: 4194304
        max_processes: 64

  - id: kotlin
    name: Kotlin
    source_filename: solution.kt
    artifact: solution.jar
    build:
      cmd: /usr/local/kotlinc/bin/kotlinc
      args: ["{{source}}", "-include-runtime", "-d", "{{artifact}}"]
      limits:
        wall_time_s: 20
        memory_kb: 4194304
        max_processes: 100
    run:
      cmd: /usr/bin/java
      args: ["-jar", "{{artifact}}"]
      limits:
        wall_time_s: 9
        memory_kb: 4194304
        max_processes: 64

  - id: dart
    name: Dart
    source_filename: solution.dart
    artifact: solution
    build:
      cmd: /usr/local/bin/dart-compile
      args: ["compile", "exe", "{{source}}", "-o", "{{artifact}}"]
      limits:
        wall_time_s: 20
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 9
        memory_kb: 524288
        max_processes: 64

  - id: pascal
    name: Pascal (Free Pascal)
    source_filename: solution.pas
    artifact: solution
    build:
      cmd: /usr/bin/fpc
      args: ["-o{{artifact}}", "{{source}}"]
      limits:
        wall_time_s: 10
        memory_kb: 1048576
        max_processes: 100
    run:
      cmd: ./{{artifact}}
      limits:
        wall_time_s: 9
        memory_kb: 524288
        max_processes: 64
